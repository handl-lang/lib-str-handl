name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # This repo is a pure `.hnl` package (no Cargo workspace), so the hnl gate
  # *is* its CI: `hnl typecheck` / `lint` / `test` over `src/`. It needs the
  # `hnl` binary, built from the sibling `cli` repo.
  hnl:
    runs-on: ubuntu-latest
    env:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: auth for private sibling git deps
        run: |
          if [ -n "$CI_TOKEN" ]; then
            git config --global url."https://x-access-token:${CI_TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "::warning::CI_TOKEN is not set — sibling fetches will fail"
          fi

      - name: checkout the cli sibling (for the hnl binary)
        run: git clone --depth 1 https://github.com/handl-lang/cli ../cli

      - name: drop cli's local [patch] tables
        # They point at sibling checkouts; with none mounted, cargo must
        # resolve cli's pinned git revs instead.
        run: |
          python3 - ../cli <<'PY'
          import pathlib, re, sys

          root = pathlib.Path(sys.argv[1])
          pat = re.compile(
              r'\n\[patch\."https://github\.com/handl-lang/[^"]+"\]'
              r'[\s\S]*?(?=\n\[|\Z)'
          )
          for p in sorted(root.rglob('Cargo.toml')):
              if 'target/' in str(p):
                  continue
              t = p.read_text()
              n = pat.sub('\n', t)
              if n != t:
                  p.write_text(n)
                  print('stripped [patch] from', p)
          PY

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ../cli -> ../cli/target

      - name: build hnl
        run: |
          cd ../cli
          cargo build --bin hnl

      - name: hnl gate
        run: HNL=../cli/target/debug/hnl ./scripts/hnl-gate.sh
